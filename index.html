<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Gastos Personales</title>
    <!-- Vinculación del CSS -->
    <link rel="stylesheet" href="css/estilos.css" />
    <!-- Vinculación del JavaScript con la regla defer -->
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Control de Gastos Personales</h1>

      <!-- Formulario de Registro -->
      <form id="form-gasto" class="card" novalidate>
        <h2>Agregar Nuevo Gasto</h2>

        <div class="form-group">
          <label for="descripcion">Descripción del gasto:</label>
          <input
            type="text"
            id="descripcion"
            name="descripcion"
            placeholder="Ej: Almuerzo"
          />
          <span class="error-msg" id="error-descripcion"></span>
        </div>

        <div class="form-group">
          <label for="valor">Valor (COP $):</label>
          <input
            type="number"
            id="valor"
            name="valor"
            placeholder="Ej: 15000"
          />
          <span class="error-msg" id="error-valor"></span>
        </div>

        <div class="form-group">
          <label for="categoria">Categoría:</label>
          <select id="categoria" name="categoria">
            <option value="">-- Seleccionar --</option>
            <option value="Comida">Comida</option>
            <option value="Transporte">Transporte</option>
            <option value="Estudio">Estudio</option>
            <option value="Otros">Otros</option>
          </select>
          <span class="error-msg" id="error-categoria"></span>
        </div>

        <button type="submit">Agregar Gasto</button>
      </form>

      <!-- Filtro por Categoría -->
      <section class="card filter-section">
        <label for="filtro-categoria">Filtrar por categoría:</label>
        <select id="filtro-categoria">
          <option value="Todas">Todas</option>
          <option value="Comida">Comida</option>
          <option value="Transporte">Transporte</option>
          <option value="Estudio">Estudio</option>
          <option value="Otros">Otros</option>
        </select>
      </section>

      <!-- Tabla de Gastos -->
      <section class="card">
        <h2>Listado de Gastos</h2>
        <table>
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Categoría</th>
              <th>Valor</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="lista-gastos">
            <!-- Las filas se insertarán dinámicamente con JS -->
          </tbody>
        </table>

        <!-- Total y Alerta -->
        <div class="total-container">
          <h3>Total Gastado: <span id="total-gastos">$ 0</span></h3>
        </div>
      </section>
    </main>
  </body>
</html>
